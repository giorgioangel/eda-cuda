[project]
name = "eda-cuda"
dynamic = ["version", "readme"]
description = "(Empirically) Decompose Anything: N-dimensional empirical decomposition on NVIDIA GPUs"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "cpp/licenses/*.txt"]
keywords = ["empirical mode decomposition", "signal decomposition", "CUDA", "NVIDIA", "GPU", "N-dimensional"]
authors = [
    { name = "Giorgio Angelotti", email = "76100950+giorgioangel@users.noreply.github.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: GPU :: NVIDIA CUDA :: 13",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.1",
    "nvidia-cufft>=12,<13",
]

[project.urls]
Source = "https://github.com/giorgioangel/eda-cuda"
Issues = "https://github.com/giorgioangel/eda-cuda/issues"

[build-system]
requires = ["scikit-build-core==1.1.1", "nanobind==3.1.0", "hatch-fancy-pypi-readme==25.1.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.28"
cmake.build-type = "Release"
build-dir = "build/wheel/{wheel_tag}"
wheel.packages = []
wheel.py-api = "cp312"
wheel.reproducible = true
install.components = ["Python"]
sdist.inclusion-mode = "explicit"
sdist.include = [
    "/CMakeLists.txt", "/pyproject.toml", "/README.md", "/LICENSE", "/NOTICE",
    "/CITATION.cff", "/cpp/**", "/src/eda/**/*.py", "/src/eda/**/*.pyi", "/src/eda/py.typed",
    "/tests/python/*.py", "/tests/data/**", "/uv.lock",
]

# One version for the Python package and the library.
[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "CMakeLists.txt"
regex = 'project\(eda VERSION (?P<value>[0-9.]+)'

# The README is the long description. Its figures are relative paths, which editors and GitHub show
# from the tree; the package index has no tree, so there they load from the repository.
[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.fancy_pypi_readme"
field = "readme"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((docs/images/[^)]+)\)'
replacement = '](https://raw.githubusercontent.com/giorgioangel/eda-cuda/main/\1)'

# The release wheel carries SASS for every supported GPU generation and PTX for the newest, which
# later GPUs compile at load time. CUDAARCHS selects others (CUDAARCHS=native for a local build).
[tool.scikit-build.cmake.define]
EDA_BUILD_PYTHON = true
EDA_BUILD_TESTS = false
EDA_CUDA_MAJOR = "13"  # the CUDA 12 package eda-cuda-cu12 has 12 (tools/build_wheels.sh)
CMAKE_CUDA_ARCHITECTURES = { env = "CUDAARCHS", default = "80-real;86-real;89-real;90-real;100-real;120" }

[dependency-groups]
dev = ["pytest", "ruff", "nanobind==3.1.0", "nvidia-cufft==12.0.0.61"]
interop = ["cupy-cuda13x==14.2.0", "torch==2.14.1"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra -q"
markers = [
    "gpu: needs an NVIDIA GPU and the CUDA extension",
    "full: the complete oracle run (selected only when -m names full)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests/python"]
extend-exclude = [".venv", "src/eda/_core.pyi"]  # the stub is nanobind stubgen output, kept byte for byte

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["eda"]
